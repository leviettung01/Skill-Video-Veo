<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <title>LeVietTung_autoveo — Captcha Bridge</title>
  <style>
    :root {
      --bg: #0f172a; --surface: #1e293b; --fg: #f8fafc; --fg-muted: #94a3b8;
      --border: #334155; --accent: #6366f1; --radius: 8px;
      --c-green: #4ade80; --c-green-bg: #14532d; --c-green-ring: rgba(74,222,128,.2);
      --c-amber: #fbbf24; --c-amber-bg: #451a03;
      --c-red: #f87171; --c-red-bg: #450a0a;
      --c-slate: #94a3b8; --c-slate-bg: #1e293b;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      width: 340px; background: var(--bg); color: var(--fg); overflow: hidden;
    }
    .status-banner {
      padding: 14px 14px 12px; display: flex; align-items: flex-start; gap: 10px;
      border-bottom: 1px solid var(--border); transition: background 200ms ease;
    }
    .status-banner[data-state="connected"] { background: var(--c-green-bg); }
    .status-banner[data-state="stale"] { background: var(--c-amber-bg); }
    .status-banner[data-state="offline"] { background: var(--c-red-bg); }
    .status-banner[data-state="noconfig"] { background: var(--c-slate-bg); }
    .dot {
      width: 13px; height: 13px; border-radius: 50%; flex-shrink: 0; margin-top: 4px;
    }
    .dot[data-state="connected"] {
      background: var(--c-green); box-shadow: 0 0 0 4px var(--c-green-ring);
    }
    .dot[data-state="stale"] { background: var(--c-amber); }
    .dot[data-state="offline"] { background: var(--c-red); }
    .dot[data-state="noconfig"] { background: var(--c-slate); }
    .status-label { font-size: 14px; font-weight: 700; line-height: 1.3; }
    .status-sub {
      font-size: 11.5px; color: var(--fg-muted); margin-top: 2px;
      font-family: 'Menlo', 'Consolas', monospace;
    }
    .quick-cfg {
      padding: 10px 12px; border-bottom: 1px solid var(--border); background: #0b1120;
    }
    .quick-cfg label { display: block; font-size: 11px; font-weight: 600; color: #cbd5e1; margin-bottom: 3px; }
    .quick-cfg input {
      width: 100%; padding: 6px 8px; font-size: 12px; font-family: Consolas, monospace;
      background: #070a12; color: #fff; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 7px;
    }
    .test-box {
      font-size: 11px; font-family: Consolas, monospace; padding: 6px 8px; border-radius: 6px; margin-top: 6px; display: none;
    }
    .test-box.ok { display: block; background: #14532d; color: #86efac; border: 1px solid #16a34a; }
    .test-box.fail { display: block; background: #450a0a; color: #fca5a5; border: 1px solid #dc2626; }
    .actions { padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      padding: 8px 12px; border-radius: var(--radius); font-size: 12.5px; font-weight: 600;
      cursor: pointer; border: 1.5px solid var(--border);
      background: var(--surface); color: var(--fg); width: 100%;
    }
    .btn:hover { border-color: var(--accent); }
    .btn-primary { background: #4f46e5; border-color: #6366f1; color: #fff; }
    .footer {
      padding: 7px 12px; border-top: 1px solid var(--border);
      font-size: 11px; color: var(--fg-muted); text-align: center;
    }
  </style>
</head>
<body>
  <div class="status-banner" id="status-banner" data-state="noconfig">
    <div class="dot" id="status-dot" data-state="noconfig"></div>
    <div class="status-text">
      <div class="status-label" id="status-label">Đang kiểm tra kết nối…</div>
      <div class="status-sub" id="status-sub">—</div>
    </div>
  </div>

  <div class="quick-cfg">
    <label>Bridge URL</label>
    <input type="url" id="pop-url" value="http://127.0.0.1:4000" />
    <label>Bridge Secret</label>
    <input type="password" id="pop-secret" />
    <div style="display:flex; gap:6px;">
      <button id="btn-save-test" class="btn btn-primary" style="padding:6px 10px;">💾 Lưu & Test Kết Nối</button>
    </div>
    <div id="pop-test-res" class="test-box"></div>
  </div>

  <nav class="actions">
    <button id="btn-options" class="btn">⚙️ &nbsp;Mở Trang Cài Đặt Đầy Đủ</button>
    <button id="btn-sidepanel" class="btn">📌 &nbsp;Mở Bảng Điều Khiển Side Panel</button>
    <button id="btn-flow" class="btn">🎬 &nbsp;Mở Flow AI</button>
  </nav>

  <footer class="footer" id="footer">LeVietTung_autoveo — Lê Việt Tùng (0915967790)</footer>

  <script src="popup.js"></script>
</body>
</html>
